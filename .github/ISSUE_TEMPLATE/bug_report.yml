name: "🐞 Bug report"
description: "Create a report to help us improve — گزارش یک مشکل در DropShrink"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **فارسی:** ممنون از گزارش شما! 🙏 لطفاً فرم را با دقت پر کنید تا مشکل سریع‌تر بررسی شود.
        **English:** Thanks for taking the time to fill out this bug report! Please describe the issue as precisely as you can.

  - type: textarea
    id: description
    attributes:
      label: "What happened? — چه اتفاقی افتاد؟"
      description: "توضیح روشن و کوتاه از مشکل / A clear and concise description of the bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce — مراحل بازتولید"
      description: "قدم‌به‌قدم توضیح دهید مشکل چگونه تکرار می‌شود / How can we reproduce the issue?"
      placeholder: |
        1. Open DropShrink
        2. Drop a video file
        3. Select preset "…"
        4. See error
    validations:
      required: true

  - type: dropdown
    id: preset
    attributes:
      label: "Preset used — پریست استفاده‌شده"
      options:
        - "Telegram — تلگرام"
        - "Web — وب"
        - "Extreme — حداکثر فشرده‌سازی"
        - "Not preset related / Other — نامربوط یا دیگر"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating system — سیستم‌عامل"
      options:
        - "Windows"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Linux"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: "DropShrink version — نسخه برنامه"
      description: "از صفحه Releases یا پایین پنجره برنامه / See the Releases page or the app window"
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: textarea
    id: ffmpeg-status
    attributes:
      label: "FFmpeg — وضعیت FFmpeg"
      description: "نسخه و منبع شناسایی‌شده (همراه برنامه / سیستم) — shown at the bottom of the app window"
      placeholder: "e.g. system, ffmpeg 7.1 — یا «FFmpeg پیدا نشد»"

  - type: textarea
    id: logs
    attributes:
      label: "Logs / error message — پیام خطا"
      description: "اگر پیام خطایی دیدید، متن کامل آن را اینجا قرار دهید / Paste the full error message if any"
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: "Anything else? — نکته دیگری هست؟"
      description: "اسکرین‌شات، فایل ورودی مشکل‌دار (در صورت امکان)، یا هر توضیح دیگر"
