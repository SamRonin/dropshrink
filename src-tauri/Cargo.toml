[package]
name = "dropshrink"
version = "0.1.0"
description = "Fast, offline drag-and-drop video & image compressor"
authors = ["DropShrink Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dropshrink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
